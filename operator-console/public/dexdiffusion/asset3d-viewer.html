<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DexDiffusion 3D Asset</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #05070b; }
    #asset-canvas { width: 100%; height: 100%; display: block; }
    #asset-hud { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; }
    #asset-hud > * { pointer-events: auto; }
    .panel { max-width: 500px; background: rgba(5,10,18,.88); border: 1px solid rgba(148,163,184,.25); border-radius: 10px; padding: 12px 14px; box-shadow: 0 12px 32px rgba(0,0,0,.32); }
    .title { color: #e6edf5; font-weight: 750; font-size: 15px; }
    .meta { color: #91a4b8; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; margin-top: 5px; line-height: 1.5; }
    .error { color: #fca5a5; white-space: pre-wrap; }
    button { border: 1px solid rgba(148,163,184,.3); background: rgba(15,23,42,.8); color: #dbeafe; border-radius: 6px; padding: 7px 10px; cursor: pointer; margin-right: 6px; }
    button:hover { border-color: #a78bfa; }
    #asset-help { align-self: flex-start; color: #94a3b8; font-size: 11px; }
  </style>
</head>
<body>
  <canvas id="asset-canvas" aria-label="DexDiffusion interactive 3D asset viewer"></canvas>
  <div id="asset-hud">
    <div class="panel" id="asset-status"><div class="title">Loading 3D Asset…</div><div class="meta">Validating canonical GLB geometry.</div></div>
    <div class="panel" id="asset-help">Drag to orbit · wheel to zoom · R reset · F fullscreen<br /><br /><button id="asset-reset">Reset camera</button><button id="asset-fullscreen">Fullscreen</button></div>
  </div>
  <script type="module" src="./asset3d-viewer.js"></script>
</body>
</html>
