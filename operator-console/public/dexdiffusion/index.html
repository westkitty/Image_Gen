s:0 8px 8px 0;padding:8px 10px 8px 12px;text-align:left;cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;display:block;">Video</button><button data-nav="true" data-active="{{ isWorldStr }}" onClick="{{ navWorld }}" style="width:100%;border:none;border-left:2px solid transparent;background:transparent;color:#6a8090;border-radius:0 8px 8px 0;padding:8px 10px 8px 12px;text-align:left;cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;display:block;">World</button><button data-nav="true" data-active="{{ is3dStr }}" onClick="{{ nav3d }}" style="width:100%;border:none;border-left:2px solid transparent;background:transparent;color:#6a8090;border-radius:0 8px 8px 0;padding:8px 10px 8px 12px;text-align:left;cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;display:block;">3D</button>

  <div style="display:flex;flex-direction:column;min-width:0;overflow:hidden;background:#080c12;">
    <sc-if value="{{ isCreate }}" hint-placeholder-val="{{ true }}">
  <div style="display:grid;grid-template-columns:minmax(300px,410px) 1fr;height:100%;">

                <div style="margin-bottom:12px;border:1px solid rgba(148,163,184,.12);border-radius:9px;padding:9px;background:rgba(9,20,32,.35);">
